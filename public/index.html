:root {
  color-scheme: light;
  --bg: #EDF1EC; --surface: #FFFFFF; --surface-2: #F5F8F4; --ink: #18231D; --ink-2: #48584F; --ink-3: #75847A;
  --line: #D6DED8; --line-2: #E7ECE8; --brand: #2F5D46; --brand-ink: #FFFFFF; --brand-soft: #E1EEE6; --brand-strong: #234735;
  --side: #1F3A2D; --side-ink: #DCE8E0; --side-dim: #92AB9C; --side-hover: #2A4A3B; --side-active: #34594A;
  --ok: #1D7A4B; --ok-soft: #E2F2E8; --warn: #9A6410; --warn-soft: #FBF0D8; --bad: #C23232; --bad-soft: #FBE7E7;
  --c-Marketing: #2A78D6; --c-Procurement: #EB6834; --c-Vendor: #1BAF7A; --c-Store: #6250D6; --c-other: #75847A;
  --shadow: 0 1px 2px rgba(24, 35, 29, .06), 0 4px 14px rgba(24, 35, 29, .05);
  --radius: 10px; --radius-sm: 6px;
  --font: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1612; --surface: #17201B; --surface-2: #1C2822; --ink: #E6EEE8; --ink-2: #B2C0B7; --ink-3: #849389;
    --line: #2B3830; --line-2: #223028; --brand: #5DAE86; --brand-ink: #0C1510; --brand-soft: #1F3329; --brand-strong: #7CC6A0;
    --side: #0B120E; --side-hover: #16231C; --side-active: #1F3329;
    --ok: #4CC088; --ok-soft: #173325; --warn: #E3A93F; --warn-soft: #382B12; --bad: #F07272; --bad-soft: #3A1B1B;
    --c-Marketing: #3987E5; --c-Procurement: #D95926; --c-Vendor: #199E70; --c-Store: #9085E9;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1612; --surface: #17201B; --surface-2: #1C2822; --ink: #E6EEE8; --ink-2: #B2C0B7; --ink-3: #849389;
  --line: #2B3830; --line-2: #223028; --brand: #5DAE86; --brand-ink: #0C1510; --brand-soft: #1F3329; --brand-strong: #7CC6A0;
  --side: #0B120E; --side-hover: #16231C; --side-active: #1F3329;
  --ok: #4CC088; --ok-soft: #173325; --warn: #E3A93F; --warn-soft: #382B12; --bad: #F07272; --bad-soft: #3A1B1B;
  --c-Marketing: #3987E5; --c-Procurement: #D95926; --c-Vendor: #199E70; --c-Store: #9085E9;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14.5px; line-height: 1.5; color: var(--ink); background: var(--bg); font-feature-settings: 'tnum' 1, 'cv11' 1; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 1.55rem; font-weight: 700; } h2 { font-size: 1.12rem; font-weight: 650; } h3 { font-size: 0.98rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--brand-strong); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-3); } .ink2 { color: var(--ink-2); } .small { font-size: 0.84rem; } .tiny { font-size: 0.76rem; }
.num { font-variant-numeric: tabular-nums; } .right { text-align: right; } .nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; } .row.wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; } .gap-s { gap: 6px; } .gap-l { gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; } .stack-l { gap: 20px; } .stack-s { gap: 6px; }
.between { justify-content: space-between; } .hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 18px 12px; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: #E7F1EA; color: #1F3A2D; display: grid; place-items: center; flex: none; }
.brand b { display: block; font-size: 0.98rem; letter-spacing: -0.01em; line-height: 1.15; color: #fff; } .brand span { font-size: 0.76rem; color: var(--side-dim); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--side-ink); font-weight: 520; text-decoration: none; position: relative; }
.nav a:hover { background: var(--side-hover); text-decoration: none; }
.nav a.active { background: var(--side-active); color: #fff; }

.toast.bad { background: var(--bad); color: #fff; }

.login-card .crop { position: absolute; width: 14px; height: 14px; border: 0 solid var(--ink-3); } .crop.a { top: -10px; left: -10px; border-right-width: 1px; border-bottom-width: 1px; } .crop.b { top: -10px; right: -10px; border-left-width: 1px; border-bottom-width: 1px; } .crop.c { bottom: -10px; left: -10px; border-right-width: 1px; border-top-width: 1px; } .crop.d { bottom: -10px; right: -10px; border-left-width: 1px; border-top-width: 1px; }

.drag { cursor: grab; color: var(--ink-3); }
